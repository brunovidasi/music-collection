name: Deploy to Namecheap over SSH

# This repo deploys itself to /home/brunovidasi/music.brunovidasi.com, the
# document root of music.brunovidasi.com (music.brunovida.si is the same folder
# and redirects there). rsync compares contents and only sends what changed;
# times aren't copied, so a changed file gets a new time (and asset_url() a new
# ?v=) and an unchanged one keeps its own.
#
# A file deleted from the repo is deleted on the server too, except what only
# lives there, protected below: the covers' small copies the sync makes, the
# certificate checks and PHP's own error logs. The instance (config, database)
# is /home/brunovidasi/music-instance, outside this folder, so no deploy can
# reach it.
#
# Run by hand from the Actions tab, it only lists what it would change, unless
# "Dry run" is unticked.

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      dry_run:
        description: Dry run (list what would change, change nothing)
        type: boolean
        default: true

jobs:
  deploy:
    name: Deploy over SSH
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # The stylesheets and scripts go up minified; the repo keeps them
      # readable. Each file is minified on its own, not bundled: the pages load
      # them as separate files whose top-level names they share, and esbuild
      # leaves top-level names alone when it isn't bundling.
      - name: Minify CSS and JS
        run: npx --yes esbuild@0.25.0 public/css/*.css public/js/*.js --minify --outdir=public --outbase=public --allow-overwrite --log-level=warning

      - name: Set up SSH
        env:
          SSH_KEY: ${{ secrets.SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts

      # SSH_TARGET_DIR (a repository variable) points a deploy at another folder,
      # relative to the account's home, such as a test copy.
      - name: Deploy with rsync
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_USER: ${{ secrets.SSH_USER }}
          TARGET: ${{ vars.SSH_TARGET_DIR || 'music.brunovidasi.com' }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && '--dry-run' || '' }}
        run: |
          rsync -rlz --checksum --delete --itemize-changes $DRY_RUN \
            --exclude='.git*' --exclude='/.github/' --exclude='node_modules/' \
            --filter='P /public/covers/' \
            --filter='P /.well-known/' \
            --filter='P /cgi-bin/' \
            --filter='P /.user.ini' \
            --filter='P error_log' \
            -e "ssh -i $HOME/.ssh/deploy_key -p $SSH_PORT -o IdentitiesOnly=yes -o BatchMode=yes" \
            ./ "$SSH_USER@$SSH_HOST:$TARGET/"
